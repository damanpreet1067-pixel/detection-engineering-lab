title: Scheduled Task Created Using Schtasks
id: 7c6e2b3a-7d4e-4a7c-9f2d-8e1b5c6a9d30
status: experimental
description: Detects creation of a scheduled task using the Windows schtasks utility.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Damanpreet
date: 2026-10-08
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005

logsource:
    category: process_creation
    product: windows

detection:
    selection:
        Image|endswith:
            - '\schtasks.exe'
        CommandLine|contains:
            - '/create'
    condition: selection

falsepositives:
    - Legitimate system administration
    - Software deployment tools
    - IT automation

level: medium
