
title: Scheduled Task Created With Script At Logon
id: 1d2a3b4c-5e6f-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: Detects scheduled task creation using schtasks with a logon trigger and Windows Script Host.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Damanpreet
date: 2026-10-09
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005

logsource:
    category: process_creation
    product: windows

detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/sc onlogon'
            - 'wscript.exe'
    condition: selection

falsepositives:
    - Legitimate logon-triggered tasks that use Windows Script Host

level: medium